name: Release

# Pushing a tag like v1.0.0 runs every check, builds the zip for the Chrome Web Store and attaches
# it to a GitHub release. Uploading it to the store stays a manual step in the developer dashboard.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The manifest takes its version from package.json, so a tag that differs would ship a zip
      # whose version is not the release's.
      - run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run zip
      - run: gh release create "$TAG" .output/loan-simulator-*-chrome.zip --title "$TAG" --generate-notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
