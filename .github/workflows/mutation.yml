name: Mutation tests

# Too slow for every pull request (about 8 minutes): weekly, and on demand from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
